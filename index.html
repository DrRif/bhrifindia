<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge Health Research Foundation — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --slate-2:#1B232D;
    --amber-1:#F0BB4D;
    --amber-2:#C2871C;
    --cream-1:#FBF8F2;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    display:flex; align-items:center; justify-content:center;
    font-family:'Public Sans', sans-serif;
    background:var(--cream-1); color:var(--slate-2);
    padding:24px; text-align:center;
  }
  .card{max-width:520px;}
  svg{margin:0 auto 28px;}
  h1{font-family:'Fraunces', serif; font-size:clamp(26px,4vw,36px); margin:0 0 14px; font-weight:600;}
  p{font-size:16px; color:#4A5563; margin:0 0 8px; line-height:1.6;}
  .tag{font-size:13px; color:var(--amber-2); font-weight:700; letter-spacing:0.06em; margin-bottom:18px; display:block;}
  a.mail{color:var(--amber-2); font-weight:600; text-decoration:none;}
  a.mail:hover{text-decoration:underline;}
</style>
</head>
<body>
  <div class="card">
    <svg width="220" height="120" viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#48586C"/><stop offset="1" stop-color="#1B232D"/>
        </linearGradient>
        <linearGradient id="a" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#F0BB4D"/><stop offset="1" stop-color="#C2871C"/>
        </linearGradient>
      </defs>
      <rect x="20" y="170" width="140" height="12" rx="2" fill="url(#s)"/>
      <rect x="300" y="170" width="140" height="12" rx="2" fill="url(#s)"/>
      <rect x="118" y="70" width="12" height="100" fill="url(#s)"/>
      <rect x="328" y="70" width="12" height="100" fill="url(#s)"/>
      <path d="M124,78 Q230,150 334,78" stroke="url(#a)" stroke-width="3" fill="none"/>
      <circle cx="90" cy="176" r="14" fill="#FBF8F2" stroke="#C2871C" stroke-width="1.4"/>
      <circle cx="370" cy="176" r="14" fill="#FBF8F2" stroke="#C2871C" stroke-width="1.4"/>
    </svg>
    <span class="tag">BRIDGE HEALTH RESEARCH FOUNDATION</span>
    <h1>Bridging the gap in health research and innovation.</h1>
    <p>Our full site is under construction.</p>
    <p>For enquiries in the meantime, reach us at<br>
      <a class="mail" href="mailto:info@bhrfindia.org">info@bhrfindia.org</a>
    </p>
  </div>
</body>
</html>
